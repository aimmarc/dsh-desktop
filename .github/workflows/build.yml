name: Build desktop installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: DeepSeek-Harness-windows-x64
          - os: macos-latest
            artifact: DeepSeek-Harness-macos-aarch64
          - os: ubuntu-22.04
            artifact: DeepSeek-Harness-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch Node runtime
        run: node scripts/fetch-node.mjs

      - name: Pack dsh runtime
        run: node scripts/pack.mjs --minify

      - name: Build Tauri app
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Linux: deb is reliable on CI; AppImage needs linuxdeploy which
            # frequently fails on hosted runners (network/toolchain issues).
            npx tauri build --bundles deb
          else
            npx tauri build
          fi
        shell: bash

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/**/*
          if-no-files-found: error

  # Upload to the GitHub Release only after ALL platform builds finish, so
  # every installer lands on the release (a per-matrix upload races and only
  # the first writer wins).
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The deb package contains the full runtime tree; uploading it with a
      # recursive glob would fan out thousands of files and exhaust the
      # uploader's connections. Upload only the top-level installer files.
      - name: Attach to release
        run: |
          ls -la artifacts/
          echo "=== installer files ==="
          find artifacts -maxdepth 2 -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.deb" \) -print
        shell: bash

      - name: Create GitHub release with installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/*.exe artifacts/*.dmg artifacts/*.deb \
            || gh release upload "${GITHUB_REF_NAME}" artifacts/*.exe artifacts/*.dmg artifacts/*.deb
