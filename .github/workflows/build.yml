name: Build desktop installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: DeepSeek-Harness-windows-x64
          - os: macos-latest
            artifact: DeepSeek-Harness-macos-aarch64
          - os: ubuntu-22.04
            artifact: DeepSeek-Harness-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal build needs both arch targets so tauri can lipo
          # the shell into a single Intel + Apple Silicon binary.
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch Node runtime
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            npm run fetch:node:universal
          else
            npm run fetch:node
          fi
        shell: bash

      - name: Pack dsh runtime
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            npm run pack:runtime:universal
          else
            npm run pack:runtime:min
          fi
        shell: bash

      - name: Build Tauri app
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Linux: deb is reliable on CI; AppImage needs linuxdeploy which
            # frequently fails on hosted runners (network/toolchain issues).
            npx tauri build --bundles deb
          elif [ "$RUNNER_OS" = "macOS" ]; then
            npx tauri build --target universal-apple-darwin
          else
            npx tauri build
          fi
        shell: bash

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Only top-level installer files. macOS universal lands under
          # target/universal-apple-darwin; Windows/Linux under target/release.
          # `bundle/*/*.dmg|exe` matches one level below bundle (nsis/dmg/deb)
          # and never descends into the deb package or .app bundle contents.
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/*/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

  # Upload to the GitHub Release only after ALL platform builds finish, so
  # every installer lands on the release (a per-matrix upload races and only
  # the first writer wins).
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release with installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only top-level installer files survive upload; collect them here.
          mapfile -t FILES < <(find artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.deb" \) | sort)
          echo "installers:"; printf '  %s\n' "${FILES[@]}"
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "${FILES[@]}" \
            || gh release upload "${GITHUB_REF_NAME}" \
              --repo "${{ github.repository }}" \
              "${FILES[@]}"
