[package]
name = "dsh-desktop"
version = "0.2.0"
description = "DeepSeek Harness desktop app — Tauri 2 shell + bundled Node runtime"
authors = ["dsh-desktop contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["time"] }
# Cross-platform process spawning with full env control.
# `duplicate_stdout`/`duplicate_stderr` keep child logs on the parent's stderr
# during `tauri dev`.

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Security",
] }
